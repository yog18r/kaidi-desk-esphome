# Add these in the ESPHome dashboard: Secrets (top right). Never publish your real values.
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"

# API key: use the one the ESPHome "New device" wizard generated, or the "encryption key" generator at
# https://esphome.io/components/api/
desk1_api_key: "paste-a-32-byte-base64-key-here="
# Password for the fallback hotspot the ESP32 opens if it can't join your Wi-Fi.
desk1_ap_password: "choose-a-password"

# Second desk: remove the leading "# " from these two lines and give them their own values.
# desk2_api_key: "paste-a-different-key-here="
# desk2_ap_password: "choose-another-password"
