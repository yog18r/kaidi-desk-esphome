# Desk Controller V3 - ESPHome configuration for a Kaidi KDDY094 standing desk (RJ50 10P10C handset cable).
#
# One file per desk: copy this file (e.g. desk1.yaml, desk2.yaml) and change only the `substitutions` below.
# Secrets (Wi-Fi, API key, fallback hotspot password) go in the ESPHome dashboard's Secrets - see secrets.example.yaml.
#
# The desk logic lives in the `kaidi_desk_controller` component, which ESPHome downloads from this repository
# when it builds. It gives Home Assistant: desk height, Up / Down / Stop and Preset 1-4 buttons, "Target height"
# (go to any height), "Desk moving", "Handset in use", "Handset button" and "Last move result".
# The handset keeps working normally and always wins: pressing any handset button stops a Home Assistant move.

substitutions:
  name: desk1                  # device name (lowercase, no spaces) - must stay the same once flashed
  friendly_name: Desk1         # name shown in Home Assistant
  api_key: !secret desk1_api_key          # this desk's API encryption key (in Secrets)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

external_components:
  # refresh: 0s makes every build download the latest version of the component.
  # To stay on a version you have tested, replace "main" with that version's full commit ID.
  - source: github://yog18r/kaidi-desk-esphome@main
    components: [kaidi_desk_controller]
    refresh: 0s

esp32:
  # Any 38-pin ESP32-DevKitC-style board (2 x 19 pins at 25.4 mm, WROOM-32 / WROOM-32E) should work: the
  # controller board powers the ESP's 3V3 pin from its own regulator. Tested with a Lonely Binary Gold Edition
  # (WROOM-32E).
  board: esp32dev
  # Keep this. 80 MHz saves ~20-25 mA, which the desk's weak 5 V supply needs: at 240 MHz the ESP reset at full
  # Wi-Fi power and wireless updates often failed partway. At 80 MHz both work.
  cpu_frequency: 80MHz
  framework:
    type: esp-idf
    # Optional tweaks. ESPHome's log suggests these at boot ("Set flash_chip: generic ...") when your ESP32
    # supports them. They only save memory/size. Uncomment all four lines if your board is a newer
    # ESP32-WROOM-32E (chip revision 3.x, e.g. the Lonely Binary Gold Edition). Leave them commented for older
    # boards: with minimum_chip_revision "3.1" the firmware won't run on an older chip.
    #advanced:
    #  flash_chip: generic
    #  minimum_chip_revision: "3.1"
    #  sram1_as_iram: true

logger:
  level: DEBUG

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    encryption:

wifi:
  # Full Wi-Fi power and roaming (the ESPHome defaults) are fine at 80 MHz: tested for hours with no restarts.
  # If your ESP32 restarts by itself (Uptime drops back near 0), add these two lines to lower the load on the
  # desk's 5V supply:
  #   output_power: 8.5dB
  #   post_connect_roaming: false
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback Hotspot
    # Read straight from Secrets, not through substitutions: a password containing "$" would otherwise be
    # treated as a substitution variable and mangled. Change the name if your secret is called something else.
    password: !secret desk1_ap_password

captive_portal:

# The pins below match the V3 board (see docs/hardware.md). NEVER have USB and the desk cable connected
# together: unplug the desk cable before plugging in USB, and unplug USB before reconnecting the desk.
uart:
  # To the control box: TX sends commands on T7 (inverted, because transistor Q1 inverts it again),
  # RX reads the height on T8.
  - id: desk_uart
    tx_pin:
      number: GPIO17
      inverted: true
    rx_pin: GPIO16
    baud_rate: 9600
  # The handset's side of the T7 switch, receive only.
  - id: handset_uart
    rx_pin: GPIO18
    baud_rate: 9600

kaidi_desk_controller:
  desk_uart_id: desk_uart
  handset_uart_id: handset_uart
  wake_pin: GPIO4              # high raises T10 while the board uses the desk
  handset_switch_pin: GPIO19   # high cuts the handset off from the box while the board is sending
  awake_sense_pin: GPIO21      # reads T10: high means the handset is awake

sensor:
  - platform: kaidi_desk_controller
    # Want inches or cm? Change the display unit in Home Assistant (Desk height > settings > Unit of
    # measurement). No firmware change is needed.
    height:
      name: "Desk height"
    raw_position:
      name: "Raw position"
    status:
      name: "Desk status"
    collision_sensitivity:
      name: "Collision sensitivity"
  # Time since the ESP last started: if it drops back to ~0 unexpectedly, the ESP restarted.
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 30s

text_sensor:
  - platform: kaidi_desk_controller
    last_move_result:
      name: "Last move result"
    handset_button:
      name: "Handset button"

binary_sensor:
  - platform: kaidi_desk_controller
    moving:
      name: "Desk moving"
    handset_in_use:
      name: "Handset in use"
    handset_not_responding:
      name: "Handset not responding"

number:
  - platform: kaidi_desk_controller
    target_height:
      name: "Target height"
      mode: box

button:
  - platform: kaidi_desk_controller
    up:
      name: "Up"
    down:
      name: "Down"
    stop:
      name: "Stop"
    preset_1:
      name: "Preset 1"
    preset_2:
      name: "Preset 2"
    preset_3:
      name: "Preset 3"
    preset_4:
      name: "Preset 4"
  - platform: restart
    name: "Restart"
