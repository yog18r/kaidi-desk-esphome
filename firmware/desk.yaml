# Desk Controller V3 - ESPHome firmware for a Kaidi KDDY094 standing desk (RJ50 10P10C handset cable).
#
# One file per desk: copy this file (e.g. desk1.yaml, desk2.yaml) and change only the `substitutions` below.
# Secrets (Wi-Fi, API key, fallback hotspot password) go in the ESPHome dashboard's Secrets - see secrets.example.yaml.
#
# Gives Home Assistant: desk height, Up / Down / Stop and Preset 1-4 buttons, "Desk moving", "Handset in use",
# "Handset button" and "Last move result". Other target heights can be Home Assistant automations.
# The handset keeps working normally and always wins: pressing any handset button stops a Home Assistant move.

substitutions:
  name: desk1                  # device name (lowercase, no spaces) - must stay the same once flashed
  friendly_name: Desk1         # name shown in Home Assistant
  api_key: !secret desk1_api_key          # this desk's API encryption key (in Secrets)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Shows in the log after each boot, so you can tell which version is actually running.
  on_boot:
    - lambda: |-
        // GPIO4 -> Q2/Q3: high raises T10 to ~4.5V while we use the desk, low leaves it alone.
        gpio_reset_pin(GPIO_NUM_4);
        gpio_set_direction(GPIO_NUM_4, GPIO_MODE_OUTPUT);
        gpio_set_level(GPIO_NUM_4, 0);
        // GPIO19 -> Q6: high opens the T7 switch (handset cut off from the box), low joins them.
        gpio_reset_pin(GPIO_NUM_19);
        gpio_set_direction(GPIO_NUM_19, GPIO_MODE_OUTPUT);
        gpio_set_level(GPIO_NUM_19, 0);
    - logger.log: "desk controller firmware 1.1 (board V3: TX 17, RX 16, T10 drive 4, T10 sense 21, T7 switch 19, handset RX 18)"

esp32:
  # Any 38-pin ESP32-DevKitC-style board (2 x 19 pins at 25.4 mm, WROOM-32 / WROOM-32E) should work: the
  # controller board powers the ESP's 3V3 pin from its own regulator. Tested with a Lonely Binary Gold Edition
  # (WROOM-32E).
  board: esp32dev
  # Keep this. 80 MHz saves ~20-25 mA, which the desk's weak 5 V supply needs: at 240 MHz the ESP reset at full
  # Wi-Fi power and wireless updates often failed partway. At 80 MHz both work.
  cpu_frequency: 80MHz
  framework:
    type: esp-idf
    # Optional tweaks. ESPHome's log suggests these at boot ("Set flash_chip: generic ...") when your ESP32
    # supports them. They only save memory/size. Uncomment all four lines if your board is a newer
    # ESP32-WROOM-32E (chip revision 3.x, e.g. the Lonely Binary Gold Edition). Leave them commented for older
    # boards: with minimum_chip_revision "3.1" the firmware won't run on an older chip.
    #advanced:
    #  flash_chip: generic
    #  minimum_chip_revision: "3.1"
    #  sram1_as_iram: true

logger:
  level: DEBUG

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    encryption:

wifi:
  # Full Wi-Fi power and roaming (the ESPHome defaults) are fine at 80 MHz: tested for hours with no restarts.
  # If your ESP32 restarts by itself (Uptime drops back near 0), add these two lines to lower the load on the
  # desk's 5V supply:
  #   output_power: 8.5dB
  #   post_connect_roaming: false
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} Fallback Hotspot
    # Read straight from Secrets, not through substitutions: a password containing "$" would otherwise be
    # treated as a substitution variable and mangled. Change the name if your secret is called something else.
    password: !secret desk1_ap_password

captive_portal:

# How the board connects (see docs/hardware.md). RJ1 = DESK (cable to the control box), RJ2 = HANDSET.
#   Power: T2 (5V) -> ME6211 regulator -> ESP 3V3 pin, T3 -> GND. NEVER have USB and the desk cable connected
#          together: unplug the desk cable before plugging in USB, and unplug USB before reconnecting the desk.
#   Height:   T8 -> R4 100k -> GPIO16 (RX), with R5 220k from GPIO16 to GND.
#   Commands: GPIO17 (TX, inverted) -> R1 1k -> Q1 MMBT3904 base (R2 10k base-GND); emitter GND;
#             collector -> 100R -> T7 (desk side). Q1 only ever pulls T7 low; R15 2.2k to 5V pulls it up.
#   Awake:    GPIO4 -> R6 1k -> Q2 base; Q2 -> R8 -> Q3 S9012 (PNP from 5V) -> R10 1k -> T10. GPIO4 high = T10
#             ~4.5V like an awake handset (needed to wake the box); low = T10 left to the handset/box.
#   T10 sense: T10 -> R18 100k -> GPIO21, with R19 220k to GND. High while we aren't driving T10 = handset awake.
#   T7 switch: desk T7 -> Q4/Q5 back-to-back 2N7002 -> handset T7. On by default (R12 10k gate-5V);
#             GPIO19 high -> R13 1k -> Q6 pulls the gates low and cuts the handset off, so its idle frames can't
#             collide with ours. If the ESP resets, the switch closes again and the handset just works.
#   Handset listen: handset T7 -> R16 100k -> GPIO18 (RX), with R17 220k from GPIO18 to GND.
# Frame format (both directions): 68 01 <b2> <b3> <b4> <sum> 16, where sum = 01+b2+b3+b4 (see docs/protocol.md).
uart:
  - id: desk_uart
    # Q1 inverts (GPIO high = T7 low), so the TX pin is inverted to cancel that out.
    tx_pin:
      number: GPIO17
      inverted: true
    rx_pin: GPIO16
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
  # Handset's side of the T7 switch, receive only. While the switch is open this hears only the handset.
  - id: handset_uart
    rx_pin: GPIO18
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1

globals:
  - id: frame_buf
    type: std::vector<uint8_t>
  - id: handset_buf
    type: std::vector<uint8_t>
  # latest decoded position: mm above the lowest position (711mm / 28.0"), -1 = unknown
  - id: cur_raw
    type: int
    initial_value: '-1'
  - id: last_decoded
    type: int
    initial_value: '-1'
  - id: last_height_ms
    type: uint32_t
    initial_value: '0'
  # when the height last changed (0 = not since boot), so "Desk moving" also shows handset moves
  - id: height_changed_ms
    type: uint32_t
    initial_value: '0'
  - id: published_raw
    type: int
    initial_value: '-1'
  # byte 2 of the box's frames: 0 normally, 48 (0x30) while locked out (E04)
  - id: box_status
    type: int
    initial_value: '-1'
  # whether GPIO4 is currently driving T10 high and GPIO19 has the T7 switch open
  - id: t10_driven
    type: bool
    initial_value: 'false'
  # true when a move starts while we're still holding the box awake (no wake tap needed)
  - id: quick_start
    type: bool
    initial_value: 'false'
  # movement: move_dir 0 idle / 1 up / 2 down / 6-9 go to preset 1-4 (the frame command we send)
  - id: move_dir
    type: int
    initial_value: '0'
  - id: move_start
    type: uint32_t
    initial_value: '0'
  - id: tail_until
    type: uint32_t
    initial_value: '0'
  # when we started sending the command, and the position at that moment
  - id: press_since
    type: uint32_t
    initial_value: '0'
  - id: press_raw
    type: int
    initial_value: '-2'
  # furthest position reached in the commanded direction (to spot the handset reversing the desk)
  - id: move_peak
    type: int
    initial_value: '-1'
  # Height limits (raw, mm above minimum), learned from end-of-travel stops and the handset's "set lower limit"
  # (hold S, then hold 1 until -L-). Kept across restarts. Used to tell "already at the top/bottom" from a fault.
  - id: min_limit_raw
    type: int
    restore_value: true
    initial_value: '0'
  - id: max_limit_raw
    type: int
    restore_value: true
    initial_value: '440'
  # last height seen during a move and when it last changed (to spot the desk stopping at its limit)
  - id: stall_pos
    type: int
    initial_value: '-1'
  - id: stall_since
    type: uint32_t
    initial_value: '0'

script:
  - id: move_manual
    parameters:
      dir: int
    then:
      - lambda: |-
          // no wake tap if the box is already awake: we're holding T10, or the handset is (a tap into an
          // awake box would twitch the desk)
          id(quick_start) = id(t10_driven) || id(t10_sense).state;
          id(move_dir) = dir;
          id(move_start) = millis();
          id(press_raw) = -2;
          id(stall_pos) = -1;
          id(stall_since) = millis();
          if (dir >= 6) ESP_LOGI("desk", "move to preset %d%s", dir - 5, id(quick_start) ? " (box already awake)" : "");
          else ESP_LOGI("desk", "move %s%s", dir == 1 ? "up" : "down", id(quick_start) ? " (box already awake)" : "");
  - id: stop_moving
    then:
      - lambda: |-
          if (id(move_dir) != 0) {
            id(move_dir) = 0;
            id(tail_until) = millis() + 500;
            id(last_stop).publish_state("stopped");
          }
          ESP_LOGI("desk", "stop at %d mm", id(cur_raw) < 0 ? -1 : id(cur_raw) + 711);

sensor:
  # The box reports mm above its 711mm minimum; the desk height is that + 711, in mm.
  # Want inches or cm? Change the display unit in Home Assistant (Desk height > settings > Unit of
  # measurement). No firmware change is needed.
  - platform: template
    name: "Desk height"
    id: desk_height
    unit_of_measurement: "mm"
    device_class: distance
    state_class: measurement
    accuracy_decimals: 0
  # bytes 3-4 as a 16-bit value: mm above the lowest position
  - platform: template
    name: "Raw position"
    id: raw_position
    entity_category: diagnostic
    accuracy_decimals: 0
  # byte 2 of the box's frames: 0 = normal. 48 (0x30) was reported while the handset showed E04
  # ("control box malfunction", cleared by holding UP+DOWN until the desk resets to its minimum).
  - platform: template
    name: "Desk status"
    id: desk_status
    entity_category: diagnostic
    accuracy_decimals: 0
  # Anti-collision sensitivity G-1..G-4, as shown in the handset's sensitivity menu (hold S, press 3).
  # Unknown until that menu is opened once.
  - platform: template
    name: "Collision sensitivity"
    id: collision_sensitivity
    entity_category: diagnostic
    accuracy_decimals: 0
  # Time since the ESP last started: if it drops back to ~0 unexpectedly, the ESP restarted.
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 30s

text_sensor:
  # Why the last Home Assistant move ended: stopped, end of travel, handset took over, already at the top/bottom,
  # or a warning such as swapped cables. Handy for automations and notifications.
  - platform: template
    name: "Last move result"
    id: last_stop
  # What the handset is sending right now: idle, up, down, preset N (height), or other (cmd N) e.g. the S button.
  - platform: template
    name: "Handset button"
    id: handset_button

binary_sensor:
  - platform: template
    name: "Desk moving"
    # On while we're running a move, or the height changed in the last 1.2 s (handset moves and coasting).
    lambda: |-
      return id(move_dir) != 0
             || (id(height_changed_ms) != 0 && millis() - id(height_changed_ms) < 1200);
  # T10 as read through R18/R19 (no internal pull: it would upset the divider)
  - platform: gpio
    id: t10_sense
    internal: true
    pin:
      number: GPIO21
      mode: INPUT
  # On while T10 is high and we aren't the ones driving it, i.e. the handset is awake.
  # The short delay skips the moment T10 is still falling after we let go.
  - platform: template
    name: "Handset in use"
    id: handset_awake
    lambda: return id(t10_sense).state && !id(t10_driven);
    filters:
      - delayed_on: 50ms

# The box sends `68 01 00 HI LO SUM 16` on T8 every ~25ms while awake (live during movement)
# and for ~12s after the handset sleeps. Junk bytes can sit between frame bytes, so on each
# 0x16 we look back to the last "68 01" and pick out 4 bytes in order that form a valid frame:
#   <status> <hi> <lo> <sum>, with sum = 01 + status + hi + lo and the value within desk travel.
# A value is accepted when it's within 10 of the previous decode (the desk moves ~1-2 per frame).
interval:
  - interval: 10ms
    then:
      - lambda: |-
          auto &buf = id(frame_buf);
          uint8_t b;
          while (id(desk_uart).available()) {
            id(desk_uart).read_byte(&b);
            buf.push_back(b);
            if (buf.size() > 20)
              buf.erase(buf.begin());
            if (b != 0x16)
              continue;

            int end = buf.size() - 1;
            int start = -1;
            for (int i = end - 2; i >= 0; i--) {
              if (buf[i] == 0x68 && buf[i + 1] == 0x01) {
                start = i + 2;
                break;
              }
            }
            if (start < 0)
              continue;
            // Fewer than 4 bytes since "68 01": this 0x16 is a data byte, not the frame end (height 21/22 or
            // 276/278 mm above minimum makes LO or SUM = 0x16). Wait for the real end instead of counting it as bad.
            if (end - start < 4)
              continue;

            int found = -1, status = -1;
            bool ambiguous = false;
            for (int a = start; a < end; a++) {
              for (int h = a + 1; h < end; h++) {
                if (buf[h] > 0x01) continue;
                for (int l = h + 1; l < end; l++) {
                  int value = (buf[h] << 8) | buf[l];
                  if (value > 460) continue;
                  uint8_t sum = 0x01 + buf[a] + buf[h] + buf[l];
                  for (int c = l + 1; c < end; c++) {
                    if (buf[c] != sum) continue;
                    if (found >= 0 && (found != value || status != buf[a])) ambiguous = true;
                    found = value;
                    status = buf[a];
                  }
                }
              }
            }
            if (found < 0 || ambiguous)
              continue;  // couldn't decode this frame: wait for the next one
            buf.clear();
            if (status != id(box_status)) {
              id(box_status) = status;
              id(desk_status).publish_state(status);
            }
            // While the handset is in a settings menu the box sends other statuses (e.g. 0x62 = 98) with the
            // setting's value where the height normally is. Only 0 (normal) and 0x30 (E04) frames carry a height.
            if (status == 0x62 && found >= 1 && found <= 4)
              id(collision_sensitivity).publish_state(found);  // sensitivity menu: current level G-1..G-4
            if (status != 0 && status != 0x30)
              continue;

            int last = id(last_decoded);
            id(last_decoded) = found;
            if (last < 0 || abs(found - last) > 10)
              continue;
            if (id(cur_raw) >= 0 && found != id(cur_raw)) {
              uint32_t t = millis();
              id(height_changed_ms) = t ? t : 1;
            }
            id(cur_raw) = found;
            id(last_height_ms) = millis();
          }

  # Listen to the handset on GPIO18. Frames: 68 01 <cmd> b3 b4 sum 16. cmd 03 idle, 01 up, 02 down,
  # 06/07/08/09 = memory preset 1-4. On this desk b3/b4 were 0 and the box drove to its own stored
  # height; an older capture had the height in mm in b3 (low) b4 (high). S alone sends nothing; S then a number sends one
  # "save" frame: S+1/2/3 = 0x0A/0B/0C, S+4 = 0x17 (all confirmed). Others: "other (cmd N)".
  # - Always: report which handset button is in use to Home Assistant.
  # - While we're moving the desk (T7 switch open): any button ends our move and joins the handset back to
  #   the box, so a handset press always wins.
  - interval: 10ms
    then:
      - lambda: |-
          static int last_cmd = -1;
          auto &buf = id(handset_buf);
          uint8_t b;
          while (id(handset_uart).available()) {
            id(handset_uart).read_byte(&b);
            buf.push_back(b);
            if (buf.size() > 7)
              buf.erase(buf.begin());
            if (buf.size() < 7 || buf[0] != 0x68 || buf[1] != 0x01 || buf[6] != 0x16)
              continue;
            if (buf[5] != (uint8_t) (0x01 + buf[2] + buf[3] + buf[4]))
              continue;
            int cmd = buf[2];
            int mm = buf[3] | (buf[4] << 8);
            int buf_b3 = buf[3], buf_b4 = buf[4];
            buf.clear();

            if (cmd != last_cmd) {
              last_cmd = cmd;
              char what[48];
              if (cmd == 0x03) snprintf(what, sizeof(what), "idle");
              else if (cmd == 0x01) snprintf(what, sizeof(what), "up");
              else if (cmd == 0x02) snprintf(what, sizeof(what), "down");
              else if (cmd >= 0x06 && cmd <= 0x09) {
                if (mm > 0) snprintf(what, sizeof(what), "preset %d (%d mm)", cmd - 5, mm);
                else snprintf(what, sizeof(what), "preset %d", cmd - 5);
              } else if ((cmd >= 0x0A && cmd <= 0x0C) || cmd == 0x17) {
                // S then a preset number: save the current height. Confirmed: S+1 0x0A, S+2 0x0B, S+3 0x0C, S+4 0x17
                // (seen twice). 0x0F was seen once, meaning unknown.
                int n = cmd == 0x17 ? 4 : cmd - 0x09;
                int h = id(cur_raw) < 0 ? -1 : id(cur_raw) + 711;
                snprintf(what, sizeof(what), "save preset %d (%d mm)", n, h);
              } else if (cmd == 0x0D) {
                // hold S, then hold 1 until -L-: lower limit set at the current height
                int h = id(cur_raw) < 0 ? -1 : id(cur_raw) + 711;
                snprintf(what, sizeof(what), "set lower limit (%d mm)", h);
                if (id(cur_raw) >= 0) id(min_limit_raw) = id(cur_raw);
              } else if (cmd == 0x13) {
                // hold S, then hold 3 until -L-: upper limit set at the current height
                int h = id(cur_raw) < 0 ? -1 : id(cur_raw) + 711;
                snprintf(what, sizeof(what), "set upper limit (%d mm)", h);
                if (id(cur_raw) >= 0) id(max_limit_raw) = id(cur_raw);
              } else if (cmd == 0x0E) {
                // hold S, then hold 2 until -C-: limits cleared (seen as 0x14 then 0x0E)
                snprintf(what, sizeof(what), "clear limits");
                id(min_limit_raw) = 0;
                id(max_limit_raw) = 440;
              } else if (cmd == 0x62) {
                snprintf(what, sizeof(what), "sensitivity menu");
              } else if (cmd == 0x19) {
                snprintf(what, sizeof(what), "set sensitivity G-%d", buf_b4);
                if (buf_b4 >= 1 && buf_b4 <= 4) id(collision_sensitivity).publish_state(buf_b4);
              } else snprintf(what, sizeof(what), "other (cmd %d, %d %d)", cmd, buf_b3, buf_b4);
              ESP_LOGI("desk", "handset: %s at %d mm", what, id(cur_raw) < 0 ? -1 : id(cur_raw) + 711);
              id(handset_button).publish_state(what);
            }

            if (id(t10_driven) && cmd != 0x03) {
              ESP_LOGI("desk", "handset button (cmd %d): handing back at %d mm", cmd,
                       id(cur_raw) < 0 ? -1 : id(cur_raw) + 711);
              id(move_dir) = 0;
              id(tail_until) = millis();
              gpio_set_level(GPIO_NUM_4, 0);
              gpio_set_level(GPIO_NUM_19, 0);
              id(t10_driven) = false;
              id(last_stop).publish_state("handset took over");
            }
          }

  # Publish the height to Home Assistant at most 4 times a second (it changes every frame while moving),
  # so Home Assistant automations can stop the desk near a target height.
  - interval: 250ms
    then:
      - lambda: |-
          int pos = id(cur_raw);
          if (pos < 0 || pos == id(published_raw))
            return;
          id(published_raw) = pos;
          id(raw_position).publish_state(pos);
          id(desk_height).publish_state(pos + 711);

  # The T7 switch is open whenever we hold T10, so the handset can't collide with these frames.
  # Send handset frames on T7 every ~13ms, copying what the handset does when it wakes a sleeping box:
  #   0-50ms idle, 50-150ms a short "tap" of the direction (wakes the box and switches its relay on),
  #   150-1650ms idle, then 68 01 01|02 00 00 sum 16 until Stop, then 0.5s of idle frames so the box
  #   sees the release, and then we go quiet so the handset can take over straight away. T10 is held
  #   high throughout. If a new move starts within that 0.5s, the command starts after 200ms with no tap.
  # Also stops if the desk reports an error, doesn't start moving, stops at its limit (height unchanged
  # for 1.5s after it has moved), stops reporting, or after 30s.
  # If the desk moves >5mm the wrong way, someone is using the handset: stop at once and skip the
  # idle frames, so we don't talk over the handset.
  - interval: 13ms
    then:
      - lambda: |-
          uint32_t now = millis();
          bool want_t10 = id(move_dir) != 0 || now < id(tail_until);
          if (want_t10 != id(t10_driven)) {
            gpio_set_level(GPIO_NUM_19, want_t10 ? 1 : 0);
            gpio_set_level(GPIO_NUM_4, want_t10 ? 1 : 0);
            id(t10_driven) = want_t10;
          }
          uint8_t cmd = 0x03;
          int dir = id(move_dir);
          if (dir != 0) {
            uint32_t elapsed = now - id(move_start);
            bool fresh = id(cur_raw) >= 0 && now - id(last_height_ms) < 1000;
            const char *why = nullptr;
            bool handset = false;
            if (id(box_status) > 0 && fresh)
              why = "desk reports an error - reset it by holding UP+DOWN on the handset";
            else if (elapsed > 30000)
              why = "timeout";
            else if (elapsed > 5000 && !fresh)
              why = "no height from the desk";
            uint32_t start_at = id(quick_start) ? 200 : 1650;
            if (!why && !id(quick_start) && elapsed >= 50 && elapsed < 150) {
              cmd = dir;  // wake tap
            } else if (!why && elapsed >= start_at) {
              if (id(press_raw) == -2) {
                id(press_since) = now;
                id(press_raw) = id(cur_raw);
                id(move_peak) = id(cur_raw);
                ESP_LOGI("desk", "sending %s %d from %d mm", dir >= 6 ? "preset" : (dir == 1 ? "up" : "down"),
                         dir >= 6 ? dir - 5 : 0, id(cur_raw) < 0 ? -1 : id(cur_raw) + 711);
              }
              int pos = id(cur_raw);
              if (pos >= 0)
                id(move_peak) = id(move_peak) < 0 ? pos
                              : dir == 1 ? std::max(id(move_peak), pos) : std::min(id(move_peak), pos);
              static char preset_why[64];
              // (presets can go either way, so the wrong-way check is for Up/Down only; the handset listener still
              // catches any handset button during a preset move)
              if (dir <= 2 && pos >= 0 && id(move_peak) >= 0 &&
                  (dir == 1 ? pos < id(move_peak) - 5 : pos > id(move_peak) + 5)) {
                why = "desk moving the other way - handset in use";
                handset = true;
              } else if ((pos < 0 || abs(pos - id(press_raw)) < 5) && now - id(press_since) > 2500) {
                // already at a limit, or our commands aren't reaching the box. With the T7 switch open we only
                // reach the box through the DESK jack, so swapped cables look exactly like this.
                if (dir >= 6) {
                  snprintf(preset_why, sizeof(preset_why), "already at preset %d (or it isn't saved)", dir - 5);
                  why = preset_why;
                } else if (pos >= 0 && dir == 1 && pos >= id(max_limit_raw) - 5)
                  why = "already at the top";
                else if (pos >= 0 && dir == 2 && pos <= id(min_limit_raw) + 5)
                  why = "already at the bottom";
                else
                  why = "desk didn't respond - check the desk and handset cables aren't swapped";
              }
              else if (pos >= 0 && abs(pos - id(press_raw)) >= 5 && pos == id(stall_pos) &&
                       now - id(stall_since) > 1500)
              {
                // it moved, then the height stopped changing: the box has hit its limit (or stopped itself)
                if (dir >= 6) {
                  // a preset move: the box drove to its stored height and stopped by itself
                  int n = dir - 5, h = pos + 711;
                  snprintf(preset_why, sizeof(preset_why), "reached preset %d (%d mm)", n, h);
                  why = preset_why;
                } else {
                  why = "desk stopped moving (end of travel)";
                  if (dir == 1) id(max_limit_raw) = pos; else id(min_limit_raw) = pos;
                }
              }
              else
                cmd = dir;
              if (pos != id(stall_pos)) {
                id(stall_pos) = pos;
                id(stall_since) = now;
              }
            }
            if (why) {
              id(move_dir) = 0;
              id(tail_until) = handset ? now : now + 500;
              if (handset) {
                // let go of the wire straight away; the handset is driving the desk now
                gpio_set_level(GPIO_NUM_4, 0);
                gpio_set_level(GPIO_NUM_19, 0);
                id(t10_driven) = false;
                ESP_LOGI("desk", "stop (%s) at %d mm", why, id(cur_raw) + 711);
                id(last_stop).publish_state(why);
                return;
              }
              cmd = 0x03;
              ESP_LOGI("desk", "stop (%s) at %d mm, status %d", why,
                       id(cur_raw) < 0 ? -1 : id(cur_raw) + 711, id(box_status));
              id(last_stop).publish_state(why);
            }
          } else if (now >= id(tail_until)) {
            return;
          }
          uint8_t frame[7] = {0x68, 0x01, cmd, 0x00, 0x00, (uint8_t) (0x01 + cmd), 0x16};
          id(desk_uart).write_array(frame, 7);

button:
  - platform: template
    name: "Up"
    icon: mdi:arrow-up
    on_press:
      - script.execute:
          id: move_manual
          dir: 1
  - platform: template
    name: "Down"
    icon: mdi:arrow-down
    on_press:
      - script.execute:
          id: move_manual
          dir: 2
  # Go to the box's stored memory positions (the handset's 1-4 buttons). The firmware sends the same "go to preset N"
  # frames as the handset (06-09) until the desk stops by itself, so it works whichever one-touch mode the handset uses.
  - platform: template
    name: "Preset 1"
    icon: mdi:numeric-1-box-outline
    on_press:
      - script.execute:
          id: move_manual
          dir: 6
  - platform: template
    name: "Preset 2"
    icon: mdi:numeric-2-box-outline
    on_press:
      - script.execute:
          id: move_manual
          dir: 7
  - platform: template
    name: "Preset 3"
    icon: mdi:numeric-3-box-outline
    on_press:
      - script.execute:
          id: move_manual
          dir: 8
  - platform: template
    name: "Preset 4"
    icon: mdi:numeric-4-box-outline
    on_press:
      - script.execute:
          id: move_manual
          dir: 9
  - platform: template
    name: "Stop"
    icon: mdi:stop
    on_press:
      - script.execute: stop_moving
  - platform: restart
    name: "Restart"
